name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ax04s
          BRANCH_NAME: main
          AUTO_PUSH: false

      - name: Fetch and Cache Streak Stats SVG
        run: |
          curl -s --retry 5 --retry-delay 3 "https://streak-stats.demolab.com/?user=ax04s&hide_border=true&background=050810&stroke=00D4FF&ring=818CF8&fire=00D4FF&currStreakLabel=00D4FF&sideLabels=94A3B8&currStreakNum=F8FAFC&sideNums=F8FAFC&dates=64748B&titleColor=00D4FF&card_width=1180" -o profile-summary-card-output/streak-stats.svg
          if grep -q "<svg" profile-summary-card-output/streak-stats.svg; then
            echo "Streak SVG successfully fetched."
          else
            echo "Failed to fetch streak SVG, retaining previous file."
            git checkout profile-summary-card-output/streak-stats.svg || true
          fi

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generate profile summary cards and streak stats" && git push)

